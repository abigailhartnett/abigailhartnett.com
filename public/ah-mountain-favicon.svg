    :root { color: #79545f; }
    @media (prefers-color-scheme: dark) { :root { color: #d1a6af; } }
  </style>
  <!-- Mountain A: a soft tapered uphill sweep and a descending alpine ridge -->
  <path fill="currentColor" d="M4.5 53.5 C10.4 51.8 15.8 44.1 21.9 34.6 L35.0 12.4 C36.5 9.8 38.1 9.7 39.6 12.4 L53.8 49.0 C54.5 51.0 55.3 52.4 56.9 53.3 L51.0 53.3 C49.5 53.1 48.7 52.2 48.1 50.5 L37.2 18.9 L24.8 39.7 C17.9 50.2 12.0 54.0 4.5 53.5 Z"/>
  <!-- H stems: one bridges the A's right slope, one stands apart -->
